    <script>
      // Filter benign Vite development HMR connection errors in sandboxed proxy environments
      (function() {
        var origError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function(a) {
            if (!a) return '';
            if (typeof a === 'object') {
              return (a.message || '') + ' ' + (a.stack || '');
            }
            return String(a);
          }).join(' ');

          if (
            msg.indexOf("Cannot read properties of undefined (reading 'send')") !== -1 ||
            (msg.indexOf('[vite]') !== -1 && (msg.indexOf('send') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('connect') !== -1))
          ) {
            return;
          }
          return origError.apply(console, args);
        };
      })();

      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason;
        var msg = (reason && reason.message) ? reason.message : String(reason || '');
        if (
          msg.indexOf("Cannot read properties of undefined (reading 'send')") !== -1 ||
          msg.indexOf("send was called before connect") !== -1 ||
          msg.indexOf("failed to connect to websocket") !== -1 ||
          msg.indexOf("WebSocket closed without opened") !== -1
        ) {
          e.preventDefault();
          if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
        }
      }, true);

      window.addEventListener('error', function (e) {
        var msg = e.message || (e.error && e.error.message) || '';
        if (
          msg.indexOf("Cannot read properties of undefined (reading 'send')") !== -1 ||
          msg.indexOf("send was called before connect") !== -1 ||
          msg.indexOf("failed to connect to websocket") !== -1 ||
          msg.indexOf("WebSocket closed without opened") !== -1
        ) {
          e.preventDefault();
          if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
        }
      }, true);
    </script>
